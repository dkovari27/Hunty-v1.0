name: Hunty Job Scraper

on:
  schedule:
    # Mon / Wed / Fri at 11:00 UTC = 13:00 CEST (summer) / 12:00 CET (winter)
    - cron: '0 6 * * 1-5'
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  scrape-and-email:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit history back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Write personal config
        run: echo "$CONFIG_PERSONAL" > config_personal.py
        env:
          CONFIG_PERSONAL: ${{ secrets.CONFIG_PERSONAL }}

      - name: Run scraper and email report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EXA_API_KEY:       ${{ secrets.EXA_API_KEY }}
          GMAIL_ADDRESS:     ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL:      ${{ secrets.REPORT_EMAIL }}
        run: python run_ci.py

      - name: Persist job history
        run: |
          git config user.name  "Hunty Bot"
          git config user.email "actions@github.com"
          git add outputs/seen_jobs_history.json
          git diff --staged --quiet || git commit -m "chore: update job history [skip ci]"
          git push
